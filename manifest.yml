modules:
  rovo:agent:
    - key: precedent-agent
      name: Precedent
      description: Checks Jira work against earlier team decisions so nobody reopens a
        settled question by accident.
      prompt: |
        You are Precedent. You tell people whether a Jira issue or proposal revisits an earlier team decision.
        Always call find-precedent (for an issue key) or check-conflict (for free text) first.
        Only report decisions the tool returned. Never invent decisions, owners, dates or links.
        Lead with any CONFLICT items: name the decision, link it, and quote what it matched on.
        If an owner is listed, suggest talking to that person before reopening the decision.
        If the tool output contains a "Note:" line, say the answer may be incomplete.
        If nothing was found, say so plainly.
      conversationStarters:
        - Has this issue already been decided?
        - Does this proposal contradict an earlier decision?
      actions:
        - find-precedent
        - check-conflict
  rovo:mcp:
    - key: precedent-mcp
      name: Precedent MCP
      tools:
        - find-precedent
        - check-conflict
  action:
    - key: find-precedent
      name: Find precedent for a Jira issue
      function: findPrecedent
      actionVerb: GET
      description: >
        Finds earlier team decisions (Confluence decision pages, Jira issues
        resolved as Won't Do) related to a Jira issue and flags ones it may
        contradict.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The Jira issue key, for example PROJ-123. Defaults to the issue in
            context.
    - key: check-conflict
      name: Check a proposal against decisions
      function: checkConflict
      actionVerb: GET
      description: >
        Checks a free-text proposal against Confluence decision pages and flags
        possible conflicts.
      inputs:
        proposal:
          title: Proposal
          type: string
          required: true
          description: The idea or change being proposed, in plain words.
  trigger:
    - key: issue-created
      function: onIssueCreated
      events:
        - avi:jira:created:issue
  function:
    - key: findPrecedent
      handler: index.findPrecedent
    - key: checkConflict
      handler: index.checkConflict
    - key: onIssueCreated
      handler: index.onIssueCreated
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - search:confluence
    - read:confluence-content.summary
    - read:graph:page:confluence
    - read:graph:user:atlassian
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  compatibility:
    jira:
      required: true
    confluence:
      required: false
  id: ari:cloud:ecosystem::app/7b13220c-82e5-4ca1-b2ec-af9a328c0f72
